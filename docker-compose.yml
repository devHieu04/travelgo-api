services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-travelgo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-travelgo}
      POSTGRES_DB: ${DB_DATABASE:-travelgo}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - travelgo-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  travelgo-db:
